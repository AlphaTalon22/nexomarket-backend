spring.datasource.url=jdbc:mysql://nexoramarket-db.cjwkbpbjiw3v.us-east-1.rds.amazonaws.com:3306/nexoramarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
