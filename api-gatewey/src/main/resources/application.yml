server:
  port: 8080 # Puerto unificado para el frontend

spring:
  application:
    name: api-gateway
  config:
    # Valores propios de cada despliegue (URL del frontend, IP de ms-rabbit-admin). NO se sube a GitHub.
    import: optional:classpath:application-secrets.properties

  # El Gateway (BFF) valida el JWT igual que el API Manager y los microservicios
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emisor (tenant del IDaaS) y audiencia (Client ID de la API) que debe traer el token
          issuer-uri: ${NEXORA_JWT_ISSUER_URI:https://login.microsoftonline.com/5f26903b-8f3c-4181-afbb-a40c0b6e034d/v2.0}
          audiences: ${NEXORA_JWT_AUDIENCE:967df881-c709-4c72-9c7c-787c1aa5557d,api://967df881-c709-4c72-9c7c-787c1aa5557d}

  cloud:
    gateway:
      routes:
        # Ruta para ms-carrito (puerto 8082)
        - id: ms-carrito
          uri: http://172.31.28.84:8082
          predicates:
            - Path=/carrito/**

        # Ruta para ms-pagos (puerto 8084)
        - id: ms-pagos
          uri: http://172.31.28.53:8084
          predicates:
            - Path=/pagos/**

        # Ruta para ms-productos (puerto 8081)
        - id: ms-productos
          uri: http://172.31.31.52:8081
          predicates:
            - Path=/productos/**

        # Ruta para ms-pedidos ( puerto 8083)
        - id: ms-pedidos
          uri: http://172.31.30.231:8083
          predicates:
            - Path=/pedidos/**

        # Ruta para ms-rabbit-admin (puerto 8085, corre en la EC2 de RabbitMQ)
        # Reemplazar por la IP PRIVADA de esa EC2, ej: http://172.31.xx.xx:8085
        - id: ms-rabbit-admin
          uri: ${RABBIT_ADMIN_URI:http://localhost:8085}
          predicates:
            - Path=/rabbit-admin/**

      # CORS: solo los orígenes conocidos del frontend pueden llamar al Gateway desde el navegador
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:4200                                   # Angular en desarrollo
              - ${NEXORA_FRONTEND_URL:http://localhost:4200}            # Angular desplegado (https://xxxx.cloudfront.net)
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

# Configuracion de actuator para ver el estado del Gateway
management:
  endpoints:
    web:
      exposure:
        include: health, routes
