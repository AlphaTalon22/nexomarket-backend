# Formación automática del clúster con la lista fija de nodos (classic config).
# Ambos nodos leen este archivo; el que arranca segundo se une al primero.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# El usuario "guest" solo puede conectarse desde localhost; los microservicios
# usan el usuario definido en RABBITMQ_USER (.env).
